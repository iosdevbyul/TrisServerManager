name: TrisServerManager
options:
  bundleIdPrefix: com.iosdevbyul
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  WakTrainerDesignSystem:
    url: https://github.com/iosdevbyul/WakTrainerDesignSystem.git
    revision: 5930de48224164723ece27491dc23893a6761a3a
targets:
  TrisServerManager:
    type: application
    platform: macOS
    sources:
      - Sources/TrisServerManager
    dependencies:
      - package: WakTrainerDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosdevbyul.TrisServerManager
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  TrisServerManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TrisServerManagerTests
    dependencies:
      - target: TrisServerManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
