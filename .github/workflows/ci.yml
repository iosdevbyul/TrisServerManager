name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PostgreSQL migration scripts
        run: bash -n scripts/homebrew-postgres-preflight.sh scripts/create-homebrew-postgres-cluster.sh scripts/backup-docker-postgres.sh scripts/verify-postgres-backup.sh scripts/validate-postgres-isolated-restore.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests
        run: xcodebuild test -project TrisServerManager.xcodeproj -scheme TrisServerManager -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned Release app
        run: |
          xcodebuild build \
            -project TrisServerManager.xcodeproj \
            -scheme TrisServerManager \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath "$RUNNER_TEMP/TrisServerManagerDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          APP="$RUNNER_TEMP/TrisServerManagerDerivedData/Build/Products/Release/TrisServerManager.app"
          test -d "$APP"
          EXECUTABLE="$APP/Contents/MacOS/TrisServerManager"
          file "$EXECUTABLE"
          lipo -info "$EXECUTABLE"
          ARCHITECTURES="$(lipo -archs "$EXECUTABLE")"
          for ARCH in arm64 x86_64; do
            case " $ARCHITECTURES " in
              *" $ARCH "*) echo "Verified $ARCH" ;;
              *) echo "Missing $ARCH architecture in Release binary"; exit 1 ;;
            esac
          done
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/TrisServerManager-unsigned.zip"
      - name: Upload unsigned build for testing
        uses: actions/upload-artifact@v4
        with:
          name: TrisServerManager-macOS-unsigned
          path: ${{ runner.temp }}/TrisServerManager-unsigned.zip
          if-no-files-found: error
          retention-days: 7
