name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild test -project TrisServerManager.xcodeproj -scheme TrisServerManager -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
